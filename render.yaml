services:
  - type: web
    name: baton-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FHIR_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
